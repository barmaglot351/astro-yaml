<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хоккей 67</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      background: #030405;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      top: -12vh;
      left: 50%;
      width: min(72vw, 620px);
      height: 66vh;
      transform: translateX(-50%);
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(226, 240, 255, .2), rgba(158, 198, 235, .08) 65%, transparent);
      filter: blur(13px);
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(78vw, 520px);
      height: 150px;
      transform: translate(-50%, -46%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(188, 221, 248, .2), rgba(89, 130, 164, .07) 46%, transparent 72%);
      filter: blur(7px);
      pointer-events: none;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      position: relative;
      text-align: center;
    }

    .puck {
      position: relative;
      width: 132px;
      height: 43px;
      border: 1px solid #050505;
      border-radius: 50% / 34%;
      background:
        repeating-linear-gradient(180deg, transparent 0 5px, rgba(255, 255, 255, .035) 6px, rgba(0, 0, 0, .3) 7px),
        linear-gradient(90deg, #070707, #202020 28%, #111 64%, #020202);
      box-shadow:
        0 22px 22px -11px rgba(0, 0, 0, .95),
        0 5px 8px rgba(0, 0, 0, .8),
        inset 4px 0 8px rgba(255, 255, 255, .06),
        inset -6px -3px 8px rgba(0, 0, 0, .75);
    }

    .puck::before {
      content: "";
      position: absolute;
      top: -16px;
      left: -1px;
      width: 132px;
      height: 36px;
      border: 1px solid #292929;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 31%, rgba(255, 255, 255, .13) 0 1px, transparent 2px),
        radial-gradient(circle at 67% 62%, rgba(255, 255, 255, .06) 0 1px, transparent 2px),
        radial-gradient(ellipse at 38% 25%, #333 0%, #191919 34%, #090909 72%, #020202 100%);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, .15),
        inset 0 -5px 9px rgba(0, 0, 0, .75),
        0 2px 1px rgba(0, 0, 0, .9);
    }

    .puck::after {
      content: "";
      position: absolute;
      top: -10px;
      left: 16px;
      width: 98px;
      height: 24px;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 50%;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, .75);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4.5rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="placeholder">
    <div class="puck" aria-hidden="true"></div>
    <h1>Хоккей 67</h1>
  </main>
</body>
</html>
