<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вертикальное хоккейное поле</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .controls button {
      min-width: 105px;
      padding: 9px 16px;
      border: 1px solid #777;
      border-radius: 999px;
      background: #171717;
      color: #aaa;
      cursor: pointer;
      font: inherit;
    }

    .controls button:hover {
      border-color: #fff;
    }

    .controls button[aria-pressed="true"] {
      border-color: #fff;
      background: #fff;
      color: #000;
    }

    .controls button:focus-visible {
      outline: 2px solid #69c9f0;
      outline-offset: 3px;
    }

    .scale-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: min(100%, 290px);
      padding: 7px 14px;
      border: 1px solid #777;
      border-radius: 999px;
      background: #171717;
      color: #fff;
    }

    .scale-control input {
      width: 150px;
      accent-color: #69c9f0;
      cursor: pointer;
    }

    .scale-value {
      min-width: 4ch;
      color: #69c9f0;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .viewport {
      width: 100%;
      overflow: auto;
    }

    .board {
      width: min(100%, 805px);
      margin: 0 auto;
      line-height: 0;
    }

    #rink {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .layer[hidden] {
      display: none;
    }

    #circlesLayer .faceoff-circle {
      stroke: #d51f36;
    }

    #circlesLayer .center-circle {
      stroke: #3586aa;
    }

    #circlesLayer .faceoff-dot {
      fill: #d51f36;
    }

    #circlesLayer .center-dot {
      fill: #3586aa;
    }

    #circlesLayer .circle-number {
      display: none;
      fill: #126fa4;
      stroke: #fff;
      stroke-width: 5;
      paint-order: stroke;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }

    #circlesLayer.grid-mode .faceoff-circle,
    #circlesLayer.grid-mode .center-circle {
      stroke: #126fa4;
    }

    #circlesLayer.grid-mode .faceoff-dot,
    #circlesLayer.grid-mode .center-dot {
      fill: #126fa4;
    }

    #circlesLayer.grid-mode .circle-number {
      display: block;
    }

    #goalsLayer .goal-number {
      display: none;
      stroke: #fff;
      stroke-width: 3;
      paint-order: stroke;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #1565c0;
    }

    #goalsLayer .red-goal-number {
      fill: #1565c0;
    }

    #goalsLayer .blue-goal-number {
      fill: #1565c0;
    }

    #goalsLayer.grid-mode .goal-number {
      display: block;
    }
  </style>
</head>
<body>
  <div class="controls" aria-label="Управление слоями">
    <button type="button" data-layer="fieldLayer" aria-pressed="true">Поле</button>
    <button type="button" data-layer="gridLayer" aria-pressed="false">Сетка</button>
    <button type="button" data-layer="circlesLayer" aria-pressed="true">Круги</button>
    <button type="button" data-layer="goalsLayer" aria-pressed="true">Ворота и зоны</button>
    <label class="scale-control" for="scale">
      <span>Масштаб</span>
      <input id="scale" type="range" min="25" max="200" step="5" value="75">
      <output id="scaleValue" class="scale-value" for="scale">75%</output>
    </label>
  </div>

  <main class="viewport">
    <div class="board" id="board">
      <svg id="rink" viewBox="0 0 805 1200" role="img" aria-label="Вертикальное хоккейное поле" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="goalNet" width="5" height="5" patternUnits="userSpaceOnUse">
          <rect width="5" height="5" fill="#eff5fa" fill-opacity=".75"/>
          <path d="M5,0 H0 V5" fill="none" stroke="#7e91a3" stroke-width=".65"/>
        </pattern>
        <!-- После поворота площадки ячейка имеет размер 64 × 60 px. -->
        <pattern id="mathGrid" x="30" y="30" width="60" height="64" patternUnits="userSpaceOnUse">
          <path d="M60,0 H0 V64" fill="none" stroke="#3ca8d4" stroke-width="1.25" opacity="0.62"/>
        </pattern>
        <clipPath id="iceClip">
          <rect x="30" y="30" width="1140" height="640" rx="180"/>
        </clipPath>
      </defs>

      <!-- Геометрия повёрнута на 90 градусов и расширена по горизонтали на 15%. -->
      <g transform="matrix(0 1 -1.15 0 805 0)">
        <g id="fieldLayer" class="layer" clip-path="url(#iceClip)" aria-label="Лёд и разметка площадки">
          <rect x="30" y="30" width="1140" height="640" rx="180" fill="#fff"/>
          <g id="rinkMarkings" fill="none" stroke-width="3.5">
            <rect x="32" y="32" width="1136" height="636" rx="178" stroke="#59636d" stroke-width="5"/>
            <path d="M600,30 V670" stroke="#d51f36" stroke-width="4"/>
            <path d="M440,30 V670 M760,30 V670" stroke="#3586aa" stroke-width="5"/>
            <path d="M150,30 V670 M1050,30 V670" stroke="#d51f36" stroke-width="4"/>

            <path d="M517,670 A83,83 0 0 1 683,670" stroke="#d51f36"/>
          </g>
        </g>

        <g id="gridLayer" class="layer" hidden clip-path="url(#iceClip)" pointer-events="none" aria-label="Координатная сетка: буквы по оси X, цифры по оси Y">
          <rect x="30" y="30" width="1140" height="640" fill="url(#mathGrid)"/>
          <g id="gridLabels"></g>
        </g>

        <!-- Все окружности и точки площадки собраны в отдельном слое. -->
        <g id="circlesLayer" class="layer" clip-path="url(#iceClip)" pointer-events="none" aria-label="Пронумерованные круги площадки">
          <!-- Центральный круг № 3. Эллипсы компенсируют расширение поля и выглядят кругами. -->
          <ellipse class="center-circle" cx="600" cy="350" rx="87" ry="75.65" fill="none" stroke-width="3.5"/>
          <ellipse class="center-dot" cx="600" cy="350" rx="7" ry="6.09" stroke="#fff" stroke-width="2"/>

          <g class="faceoff-circle" transform="translate(295 190) scale(1 .869565)" fill="none" stroke-width="3.5">
            <circle r="87"/>
            <circle class="faceoff-dot" r="7" stroke="none"/>
            <path d="M-14,-86 V-97 M14,-86 V-97 M-14,86 V97 M14,86 V97 M-14,-20 V20 M14,-20 V20 M-14,-4 H-38 M-14,4 H-38 M14,-4 H38 M14,4 H38"/>
          </g>
          <g class="faceoff-circle" transform="translate(295 510) scale(1 .869565)" fill="none" stroke-width="3.5">
            <circle r="87"/>
            <circle class="faceoff-dot" r="7" stroke="none"/>
            <path d="M-14,-86 V-97 M14,-86 V-97 M-14,86 V97 M14,86 V97 M-14,-20 V20 M14,-20 V20 M-14,-4 H-38 M-14,4 H-38 M14,-4 H38 M14,4 H38"/>
          </g>
          <g class="faceoff-circle" transform="translate(905 190) scale(1 .869565)" fill="none" stroke-width="3.5">
            <circle r="87"/>
            <circle class="faceoff-dot" r="7" stroke="none"/>
            <path d="M-14,-86 V-97 M14,-86 V-97 M-14,86 V97 M14,86 V97 M-14,-20 V20 M14,-20 V20 M-14,-4 H-38 M-14,4 H-38 M14,-4 H38 M14,4 H38"/>
          </g>
          <g class="faceoff-circle" transform="translate(905 510) scale(1 .869565)" fill="none" stroke-width="3.5">
            <circle r="87"/>
            <circle class="faceoff-dot" r="7" stroke="none"/>
            <path d="M-14,-86 V-97 M14,-86 V-97 M-14,86 V97 M14,86 V97 M-14,-20 V20 M14,-20 V20 M-14,-4 H-38 M-14,4 H-38 M14,-4 H38 M14,4 H38"/>
          </g>

          <g stroke="none">
            <ellipse class="faceoff-dot" cx="472" cy="204" rx="7" ry="6.09"/>
            <ellipse class="faceoff-dot" cx="728" cy="204" rx="7" ry="6.09"/>
            <ellipse class="faceoff-dot" cx="472" cy="496" rx="7" ry="6.09"/>
            <ellipse class="faceoff-dot" cx="728" cy="496" rx="7" ry="6.09"/>
          </g>

          <g aria-label="Номера кругов">
            <text class="circle-number" x="295" y="510" transform="rotate(-90 295 510)">1</text>
            <text class="circle-number" x="295" y="190" transform="rotate(-90 295 190)">2</text>
            <text class="circle-number" x="600" y="350" transform="rotate(-90 600 350)">3</text>
            <text class="circle-number" x="905" y="510" transform="rotate(-90 905 510)">4</text>
            <text class="circle-number" x="905" y="190" transform="rotate(-90 905 190)">5</text>
          </g>
        </g>

        <g id="goalsLayer" class="layer" aria-label="Красные и синие ворота с вратарскими зонами">
          <!-- Вратарские зоны являются частью слоя ворот. -->
          <path d="M150,300 A50,50 0 0 1 150,400 Z"
                fill="#56a9c5" fill-opacity="0.72" stroke="#d51f36" stroke-width="3"/>
          <path d="M1050,300 A50,50 0 0 0 1050,400 Z"
                fill="#56a9c5" fill-opacity="0.72" stroke="#1565c0" stroke-width="3"/>

          <!-- Красные ворота № 1. -->
          <g transform="translate(150 350)">
            <path d="M0,-50 H-18 Q-30,-50 -30,-38 V38 Q-30,50 -18,50 H0 Z" fill="url(#goalNet)" pointer-events="none"/>
            <path d="M0,-50 H-18 Q-30,-50 -30,-38 V38 Q-30,50 -18,50 H0" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          </g>

          <!-- Синие ворота № 2. -->
          <g transform="translate(1050 350)">
            <path d="M0,-50 H18 Q30,-50 30,-38 V38 Q30,50 18,50 H0 Z" fill="url(#goalNet)" pointer-events="none"/>
            <path d="M0,-50 H18 Q30,-50 30,-38 V38 Q30,50 18,50 H0" fill="none" stroke="#1565c0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
          </g>

          <text class="goal-number red-goal-number" x="175" y="350" transform="rotate(-90 175 350)">1</text>
          <text class="goal-number blue-goal-number" x="1025" y="350" transform="rotate(-90 1025 350)">2</text>
        </g>
      </g>
      </svg>
    </div>
  </main>

  <script>
    (function () {
      var namespace = "http://www.w3.org/2000/svg";
      var labels = document.getElementById("gridLabels");

      function addLabel(value, x, y) {
        var label = document.createElementNS(namespace, "text");
        label.setAttribute("x", x);
        label.setAttribute("y", y);
        label.setAttribute("transform", "rotate(-90 " + x + " " + y + ")");
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("dominant-baseline", "middle");
        label.setAttribute("fill", "#176f98");
        label.setAttribute("stroke", "#fff");
        label.setAttribute("stroke-width", "2.5");
        label.setAttribute("paint-order", "stroke");
        label.setAttribute("font-size", "11");
        label.setAttribute("font-family", "Segoe UI, Arial, sans-serif");
        label.setAttribute("font-weight", "700");
        label.setAttribute("opacity", "0.7");
        label.textContent = value;
        labels.appendChild(label);
      }

      // Экранная ось X идёт слева направо буквами A–J, ось Y — сверху вниз числами 1–19.
      // Координаты пересчитаны в исходную систему до общего поворота площадки на 90°.
      for (var row = 0; row < 19; row += 1) {
        for (var column = 0; column < 10; column += 1) {
          var letter = String.fromCharCode(65 + column);
          var originalX = 60 + row * 60;
          var originalY = 638 - column * 64;
          addLabel(letter + (row + 1), originalX, originalY);
        }
      }

      document.querySelectorAll("[data-layer]").forEach(function (button) {
        button.addEventListener("click", function () {
          var layer = document.getElementById(button.dataset.layer);
          var willBeVisible = button.getAttribute("aria-pressed") !== "true";
          layer.toggleAttribute("hidden", !willBeVisible);
          button.setAttribute("aria-pressed", String(willBeVisible));

          if (button.dataset.layer === "gridLayer") {
            document.getElementById("circlesLayer").classList.toggle("grid-mode", willBeVisible);
            document.getElementById("goalsLayer").classList.toggle("grid-mode", willBeVisible);
          }
        });
      });

      var board = document.getElementById("board");
      var scale = document.getElementById("scale");
      var scaleValue = document.getElementById("scaleValue");

      function updateScale() {
        var percent = Number(scale.value);
        var availableWidth = Math.max(1, window.innerWidth - 32);
        var fittedWidth = Math.min(805, availableWidth);
        board.style.width = fittedWidth * percent / 100 + "px";
        scaleValue.value = percent + "%";
      }

      scale.addEventListener("input", updateScale);
      window.addEventListener("resize", updateScale);
      updateScale();
    })();
  </script>
</body>
</html>
